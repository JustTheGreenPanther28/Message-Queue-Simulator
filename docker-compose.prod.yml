# Production-style run, layered on docker-compose.yml:
#   cp .env.prod.example .env.prod   # fill in real secrets
#   docker compose -p tilechat-prod -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from the dev setup:
#  - Spring "prod" profile: no default secrets, startup refuses dev values (ProductionSafetyCheck).
#  - Every secret comes from the env file; a missing one stops `docker compose` before anything starts.
#  - Only the web entry point is published (object storage is proxied at /storage). Databases, broker,
#    cache, gateway and services are reachable only on the internal network.
#  - App containers: read-only root filesystem, all Linux capabilities dropped, no privilege
#    escalation, memory limits, restart on failure.
#  - Redis requires a password.
#
# For real deployments, replace postgres/redis/rabbitmq/seaweedfs with managed services
# (e.g. RDS, ElastiCache, Amazon MQ, S3) and point the env vars at them.

x-app-hardening: &app-hardening
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  deploy:
    resources:
      limits: { memory: 768m }

x-prod-env: &prod-env
  SPRING_PROFILES_ACTIVE: prod
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:?set RABBIT_PASSWORD}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-/storage}
  S3_CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
  WS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
  JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports: !reset []
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: !reset []
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?set RABBIT_PASSWORD}
    ports: !reset []   # no management UI on the network either
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  seaweedfs:
    # Credentials come from the env file instead of the dev s3.json.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"tilechat","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes: !override
      - objects:/data
    ports: !reset []   # browsers reach it only through nginx at /storage
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  user-service:
    <<: *app-hardening
    environment:
      <<: *prod-env
      S3_INIT_BUCKET: "true"   # self-hosted storage: create bucket + CORS rule on first start

  chat-service:
    <<: *app-hardening
    environment:
      <<: *prod-env
      S3_INIT_BUCKET: "true"

  notification-service:
    <<: *app-hardening
    environment:
      <<: *prod-env

  api-gateway:
    <<: *app-hardening
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Dsun.net.inetaddr.ttl=10 -Dsun.net.inetaddr.negative.ttl=1
    ports: !reset []   # only nginx (web) reaches it, so X-Forwarded-For can be trusted

  web:
    environment:
      S3_PUBLIC_ORIGIN: ${S3_PUBLIC_ORIGIN:-}   # only for direct mode (e.g. an S3 bucket URL)
    ports: !override
      - "${WEB_PORT:-3000}:80"
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/etc/nginx/conf.d", "/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    restart: unless-stopped
