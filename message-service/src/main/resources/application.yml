server:
  port: 8081

spring:
  application:
    name: message-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/message_db
    username: app
    password: app
  sql:
    init:
      mode: always          # runs schema.sql on startup (all statements are IF NOT EXISTS)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 500ms        # fail fast so a slow/down Redis doesn't block requests
      connect-timeout: 500ms
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: app
    password: app
    publisher-confirm-type: simple   # lets the outbox wait for broker acks

app:
  cache:
    recent-messages-ttl-seconds: 300
  outbox:
    poll-interval-ms: 1000
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
