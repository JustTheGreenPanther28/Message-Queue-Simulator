name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Integration tests use Testcontainers (Postgres, S3), which the runner's Docker provides.
      - run: ./mvnw -B verify
        working-directory: backend

  frontend:
    name: Frontend (tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    name: Production-mode stack (e2e + security checks)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate throwaway secrets
        run: |
          for k in JWT_SECRET DB_PASSWORD RABBIT_PASSWORD REDIS_PASSWORD S3_ACCESS_KEY S3_SECRET_KEY; do
            echo "$k=$(openssl rand -hex 24)"
          done > .env.prod
          echo "PUBLIC_ORIGIN=http://localhost:3000" >> .env.prod
      - name: Start the stack in production mode
        run: docker compose -p tilechat-prod -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build --wait --wait-timeout 300
      - run: node scripts/e2e.mjs
      - run: ./scripts/security-check.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -p tilechat-prod logs --tail 200
      - name: Scan images for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: tilechat-prod-chat-service
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
