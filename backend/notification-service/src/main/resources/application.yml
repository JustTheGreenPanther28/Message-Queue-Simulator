server:
  port: ${PORT:8083}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:app}
    password: ${RABBIT_PASSWORD:app}
    connection-timeout: 3s
    listener:
      simple:
        # Retry 4 times with exponential backoff, then reject -> dead-letter queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

app:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:/storage}   # same-origin via proxy; or an absolute URL for direct mode
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:tilechat}
    secret-key: ${S3_SECRET_KEY:tilechat-local-secret}
    bucket: ${S3_BUCKET:tilechat}
    init-bucket: ${S3_INIT_BUCKET:false}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
  # Set e.g. 0.5 to make half of all deliveries fail and watch retries / the DLQ.
  simulate-failure-rate: ${SIMULATE_FAILURE_RATE:0}

management:
  endpoints.web.exposure.include: health

# --- runtime conventions (all environments) ---
server.shutdown: graceful                      # finish in-flight requests on SIGTERM
spring.lifecycle.timeout-per-shutdown-phase: 20s
management.endpoint.health.probes.enabled: true   # /actuator/health/liveness and /readiness
management.endpoint.health.show-details: never
app.websocket.allowed-origins: ${WS_ALLOWED_ORIGINS:*}
