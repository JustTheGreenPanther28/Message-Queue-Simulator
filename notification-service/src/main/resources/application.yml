server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notification_db
    username: app
    password: app
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: app
    password: app
    listener:
      simple:
        concurrency: 2              # 2..4 parallel consumers
        max-concurrency: 4
        prefetch: 10
        # Safety net: if an exception ever escapes the listener, don't requeue
        # it forever — the main queue dead-letters it to the DLQ instead.
        default-requeue-rejected: false

app:
  retry:
    max-attempts: 3
    delay-ms: 5000
  # Set e.g. 0.5 to make half the deliveries fail and watch retry -> DLQ work.
  simulate-failure-rate: ${SIMULATE_FAILURE_RATE:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health
